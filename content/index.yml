sobre_nos:
  title: Sobre Nós
  description: Fundada acerca de princípios, a R2J, além de assegurar conformidade fiscal, proporciona uma excelente otimização burocrática e uma análise de dados contábeis para tomada de decisões estratégicas para o sucesso do seu negócio.
  image: 
    src: r2j/capas/capa-02_ruu7om
    alt: Image alt text
  link:
    label: Saiba Mais >
    size: sm
segmentos:
  title: Segmentos
  description: A R2J é uma empresa de contabilidade especializada em diversos segmentos, com o objetivo de atender as necessidades de cada cliente.
  items:
    - icon: /img/segmento-mei.svg
      title: MEI
      description: Criação, regularização, alteração, declaração anual e assessoria completa
      bg: '#2B4857'
      $class: py-10 sm:py-20 px-6 sm:px-16
    - icon: /img/segmento-profissionais-saude.svg
      title: Profissionais da Saúde
      description: Especialidade no ramo da saúde, conforme complexidades regulatórias e fiscais específicas.
      bg: '#2A3640'
      $class: py-10 lg:py-20 px-6 lg:px-16
    - icon: /img/segmento-pessoal.svg
      title: Pessoal
      description: Assessoria fiscal trabalhista completa.
      bg: '#2A2C34'
      $class: py-10 lg:py-20 px-6 lg:px-16
    - icon: /img/segmento-comercio-vendas.svg
      title: Comércio e Vendas
      description: Abertura, regulamentação, fiscalização e cálculos trabalhistas.
      bg: '#2B4857' 
      $class: py-10 lg:pt-0 lg:pb-20 px-6 lg:px-16
    - icon: /img/segmento-assessoria-especializada.svg
      title: Assessoria Personalizada
      description: Planejamento tributário, declaração de IR, certificações e licenças.
      bg: '#2A3640' 
      $class: py-10 lg:pt-0 lg:pb-20 px-6 lg:px-16
    - icon: /img/sagmento-empresas-digitais.svg
      title: Empresas Digitais
      description: Legalização, regulamentação, e assessoria personalizada.
      bg: '#2A2C34'
      $class: py-10 lg:pt-0 lg:pb-20 px-6 lg:px-16
profiles:
  - name: Júnior Almeida
    reverse: false
    descriptions:
      - Desempenhamos o papel fundamental na manutenção da saúde financeira, garantindo conformidade com as leis fiscais e regulamentações de todo negócio.
      - Facilitaremos a sua tomada de decisões estratégicas, fazendo com que o seu negócio otimize o crescimento e eficiencia operacional.
    photo:
      src: r2j/profiles/jr-03_es5kzk
      alt: Image alt text
  - name: Rone Ramos
    reverse: true
    descriptions:
      - Profissional especializado no ramo da saúde, entendendo as complexidades regulatórias e fiscais específicas
      - Oferecemos Expertise em gestão, e proporcionamos uma visão clara do que é crucial para a eficiência operacional e o sucesso sustentável no setor
    photo:
      src: r2j/profiles/rone-01_rj4zqb
      alt: Image alt text
