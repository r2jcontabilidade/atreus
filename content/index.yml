title: R2J - Contabilidade
description: A contabilidade digital é uma abordagem inovadora para a gestão financeira e contábil que utiliza tecnologia avançada e ferramentas digitais para coletar, processar, analisar e relatar informações financeiras conforme estabelecido em cada nicho.
inicio:
  headline: Contabilidade digital · Feira de Santana–BA
  title: O futuro do seu negócio depende de você.
  highlight: A contabilidade, deixa com a gente.
  description: Conformidade fiscal, menos burocracia e dados contábeis claros para você tomar decisões estratégicas com segurança — do MEI à empresa estabelecida.
  link:
    label: Quero falar com vocês
  secondary:
    label: Ver segmentos
    to: '#segmentos'
  highlights:
    - Atendimento 100% digital
    - Especialistas na área da saúde
    - Do MEI à empresa estabelecida
  image:
    src: /img/escritorio-rone.png
    alt: Rone Ramos trabalhando no escritório da R2J, com a marca R2J Contabilidade Digital na tela ao fundo
  card:
    icon: i-heroicons-shield-check
    title: Conformidade fiscal
    description: Seu negócio em dia com as leis e regulamentações
contabilidade_digital:
  headline: Contabilidade digital
  title: Você já ouviu falar em contabilidade digital?
  description: Uma abordagem inovadora para a gestão financeira e contábil, que usa tecnologia e ferramentas digitais para coletar, processar, analisar e relatar as informações do seu negócio — conforme as regras de cada nicho.
  image:
    src: /img/contabilidade-digital-3.png
    alt: Empreendedora sorrindo no balcão da sua loja
  steps:
    - title: Coletar
      description: Notas, extratos e documentos chegam por canais digitais. Nada de papelada indo e voltando.
    - title: Processar
      description: Lançamentos, apurações e obrigações feitos com ferramentas que reduzem erro e retrabalho.
    - title: Analisar
      description: Os números do seu negócio lidos com o olhar de quem conhece o seu segmento.
    - title: Relatar
      description: Relatórios claros para você decidir os próximos passos com segurança.
segmentos:
  headline: Segmentos
  title: Contabilidade sob medida para cada tipo de negócio
  description: A R2J é especializada em diversos segmentos, com o objetivo de atender às necessidades de cada cliente.
  items:
    - icon: /img/segmento-mei.svg
      title: MEI
      description: Criação, regularização, alteração, declaração anual e assessoria completa.
    - icon: /img/segmento-profissionais-saude.svg
      title: Profissionais da Saúde
      description: Especialidade no ramo da saúde, com atenção às complexidades regulatórias e fiscais específicas.
    - icon: /img/segmento-pessoal.svg
      title: Pessoal
      description: Assessoria fiscal e trabalhista completa.
    - icon: /img/segmento-comercio-vendas.svg
      title: Comércio e Vendas
      description: Abertura, regulamentação, fiscalização e cálculos trabalhistas.
    - icon: /img/segmento-assessoria-especializada.svg
      title: Assessoria Personalizada
      description: Planejamento tributário, declaração de IR, certificações e licenças.
    - icon: /img/sagmento-empresas-digitais.svg
      title: Empresas Digitais
      description: Legalização, regulamentação e assessoria personalizada.
sobre_nos:
  headline: Sobre nós
  title: Fundada sobre princípios. Feita para o sucesso do seu negócio.
  description: Além de assegurar a conformidade fiscal, a R2J proporciona otimização burocrática e análise de dados contábeis para a tomada de decisões estratégicas — para que você foque no que faz o seu negócio crescer.
  items:
    - icon: i-heroicons-shield-check
      title: Conformidade fiscal
      description: Seu negócio em dia com leis fiscais e regulamentações, sem sustos.
    - icon: i-heroicons-clipboard-document-check
      title: Menos burocracia
      description: Processos otimizados para você gastar tempo com o seu negócio, não com papéis.
    - icon: i-heroicons-chart-bar
      title: Decisões com dados
      description: Análise contábil que mostra o que é crucial para crescer com eficiência.
equipe:
  headline: Quem cuida do seu negócio
  profiles:
    - name: Rone Ramos
      role: Especialista em contabilidade para a área da saúde
      descriptions:
        - Profissional especializado no ramo da saúde, que entende as complexidades regulatórias e fiscais específicas do setor.
        - Oferecemos expertise em gestão e uma visão clara do que é crucial para a eficiência operacional e o sucesso sustentável do seu negócio.
      photo:
        src: r2j/profiles/rone-01_rj4zqb
        alt: Rone Ramos, de terno, com os braços cruzados
      link:
        label: Agendar uma conversa
